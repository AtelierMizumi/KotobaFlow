# =============================================================================
# KotobaFlow — API Gateway (Nginx)
# Unified reverse proxy providing a single API endpoint for all clients:
#   - Web frontend
#   - Browser extension
#   - Mobile app
#   - Any HTTP client
#
# All backend services are accessible through http://localhost:8000/api/
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 500M;  # For video uploads

    # =========================================================================
    # Upstream services — use resolver so nginx doesn't crash if a service
    # is temporarily unavailable at startup.
    # =========================================================================
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8000;
        server_name _;

        # =====================================================================
        # CORS Headers — Allow browser extension & cross-origin access
        # =====================================================================
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
        add_header 'Access-Control-Max-Age' '86400' always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # =====================================================================
        # Health Check
        # =====================================================================
        location /health {
            return 200 '{"status":"healthy","service":"api-gateway"}';
            add_header Content-Type application/json;
        }

        # =====================================================================
        # Media Handler — /api/media/*
        # =====================================================================
        location /api/media/ {
            set $media_upstream http://media-handler:8003;
            rewrite ^/api/media/(.*) /api/$1 break;
            proxy_pass $media_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;  # Long timeout for downloads
        }

        # =====================================================================
        # Inference Worker — /api/transcribe/*
        # =====================================================================
        location /api/transcribe/ {
            set $inference_upstream http://inference-worker:8001;
            rewrite ^/api/transcribe/(.*) /api/$1 break;
            proxy_pass $inference_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 600s;  # Very long timeout for transcription
        }

        # =====================================================================
        # Inference Worker — Cached transcript endpoint
        # =====================================================================
        location /api/transcript/ {
            set $inference_upstream http://inference-worker:8001;
            rewrite ^/api/transcript/(.*) /api/transcript/$1 break;
            proxy_pass $inference_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # =====================================================================
        # Inference Worker — WebSocket for streaming
        # =====================================================================
        location /ws/ {
            set $inference_upstream http://inference-worker:8001;
            proxy_pass $inference_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # =====================================================================
        # NLP Processor — /api/nlp/*
        # =====================================================================
        location /api/nlp/ {
            set $nlp_upstream http://nlp-processor:8002;
            rewrite ^/api/nlp/(.*) /api/$1 break;
            proxy_pass $nlp_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # JMDict export — heavy response, long cache, longer timeout
        location /api/nlp/jmdict-export {
            set $nlp_upstream http://nlp-processor:8002;
            rewrite ^/api/nlp/(.*) /api/$1 break;
            proxy_pass $nlp_upstream;
            proxy_set_header Host $host;
            proxy_read_timeout 120s;
            add_header Cache-Control "public, max-age=86400";
        }
    }
}
