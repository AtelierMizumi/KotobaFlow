version: '3.8'

services:
  # ===========================================================================
  # Web Frontend — Next.js (React)
  # ===========================================================================
  web-frontend:
    build:
      context: ./services/web-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8001
    depends_on:
      inference-worker:
        condition: service_healthy
      nlp-processor:
        condition: service_healthy
      media-handler:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
    networks:
      - kotobaflow-net
    restart: unless-stopped

  # ===========================================================================
  # API Gateway — Nginx reverse proxy (unified API for all clients)
  # Provides a single endpoint for web, browser extension, mobile, etc.
  # ===========================================================================
  api-gateway:
    image: nginx:alpine
    ports:
      - "8000:8000"
    volumes:
      - ./services/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - inference-worker
      - nlp-processor
      - media-handler
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    networks:
      - kotobaflow-net
    restart: unless-stopped

  # ===========================================================================
  # Inference Worker — Faster-Whisper STT
  # ===========================================================================
  inference-worker:
    build:
      context: ./services/inference-worker
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-medium}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - WHISPER_LANGUAGE=${WHISPER_LANGUAGE:-ja}
      - WHISPER_BEAM_SIZE=${WHISPER_BEAM_SIZE:-5}
      - WHISPER_CPU_THREADS=${WHISPER_CPU_THREADS:-4}
      - WHISPER_NUM_WORKERS=${WHISPER_NUM_WORKERS:-1}
      - OMP_NUM_THREADS=${WHISPER_CPU_THREADS:-4}
      - MEDIA_SERVICE_URL=http://media-handler:8003
      - NLP_SERVICE_URL=http://nlp-processor:8002
    volumes:
      - whisper-models:/app/models
      - media-cache:/app/media-cache:ro
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '4.0'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - kotobaflow-net
    restart: unless-stopped

  # ===========================================================================
  # NLP Processor — SudachiPy + JMDict
  # ===========================================================================
  nlp-processor:
    build:
      context: ./services/nlp-processor
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - SUDACHI_DICT_TYPE=${SUDACHI_DICT_TYPE:-small}
      - JMDICT_DB_PATH=/app/data/jmdict.db
    volumes:
      - ./data:/app/data:ro
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - kotobaflow-net
    restart: unless-stopped

  # ===========================================================================
  # Media Handler — yt-dlp + FFmpeg
  # ===========================================================================
  media-handler:
    build:
      context: ./services/media-handler
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      - MEDIA_CACHE_DIR=/app/media-cache
      - MAX_VIDEO_DURATION=${MAX_VIDEO_DURATION:-3600}
      - AUDIO_SAMPLE_RATE=${AUDIO_SAMPLE_RATE:-16000}
    volumes:
      - media-cache:/app/media-cache
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - kotobaflow-net
    restart: unless-stopped

# =============================================================================
# Volumes
# =============================================================================
volumes:
  whisper-models:
    driver: local
  media-cache:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  kotobaflow-net:
    driver: bridge
